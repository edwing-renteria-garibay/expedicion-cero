    <circle cx="20" cy="12" r="17" fill="#1e2b3d"/><circle cx="20" cy="12" r="11" fill="#ff3b30"/>

<defs>
 <radialGradient id="bg" cx="0.5" cy="0.42" r="0.75"><stop offset="0" stop-color="#5fd0ff"/><stop offset="0.6" stop-color="#2e7fd6"/><stop offset="1" stop-color="#22357a"/></radialGradient>
