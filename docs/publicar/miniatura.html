<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a9cf0"/><stop offset="0.7" stop-color="#8fd8ff"/><stop offset="1" stop-color="#d6f3ff"/></linearGradient>

 <path d="M80,700 q30,-14 60,0 q30,14 60,0"/><path d="M1500,720 q30,-14 60,0 q30,14 60,0"/><path d="M1700,860 q30,-14 60,0 q30,14 60,0"/>
</g>
